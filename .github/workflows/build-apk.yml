name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is $JAVA_VER, expected 17 or newer"
            exit 1
          fi
          echo "Java major version verified: $JAVA_VER"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore missing, generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "debug.keystore verified."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Debug APK successfully created at app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "Error: app/build/outputs/apk/debug/app-debug.apk missing!"
            echo "Searching for any generated APKs under app/build/outputs/apk..."
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
